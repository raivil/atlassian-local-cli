name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: atlassian-local-cli-macos-arm64
          - os: ubuntu-latest
            arch: x86_64
            artifact: atlassian-local-cli-linux-x86_64

    runs-on: ${{ matrix.os }}
    env:
      # uv's own Python links the stdlib extensions into libpython. setup-python's
      # ships ~60 of them as separate dylibs, which a onefile binary unpacks on
      # every run: 2.4s to print --version, against 0.5s.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Build binary
        run: uv run pyinstaller --onefile --name ${{ matrix.artifact }} --copy-metadata atlassian-local-cli main.py

      - name: Verify binary
        run: |
          # A runner label can name the wrong architecture: macos-15 is Apple
          # Silicon and shipped the "x86_64" artifact as arm64.
          if [ "$(uname -m)" != "${{ matrix.arch }}" ]; then
            echo "::error::runner is $(uname -m), artifact claims ${{ matrix.arch }}"
            exit 1
          fi
          ./dist/${{ matrix.artifact }} --help
          time ./dist/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x artifacts/*

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
